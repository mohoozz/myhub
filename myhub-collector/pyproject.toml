[project]
name = "myhub-collector"
version = "0.1.0"
description = "MyHub 采集服务：每天拉取关注列表，下载前一天的内容并生成总结"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28",
    "sqlmodel>=0.0.49",  # 0.0.49 起才支持 NaiveDatetime 映射成 DateTime(timezone=False)
    "pydantic-settings>=2.5",
    "yt-dlp>=2026.8.19",
    # YouTube 的 JS 挑战求解脚本（配合 Deno 运行时；缺了只能拿到预览图）
    "yt-dlp-ejs>=0.8.0",
    # 抖音：驱动已登录的浏览器抓关注列表与作品（签名由页面自己算）
    "playwright>=1.45",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
