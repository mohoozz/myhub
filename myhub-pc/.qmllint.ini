# myhub-pc QML 静态检查配置（qmllint 6.8）
#
# 唯一关闭的检查：missing-property
#
# 原因（有实验证据，不是「嫌烦就关」）：
#   主题令牌是 QML 单例 `Colors`（pragma Singleton），由 `AppTheme.colors` 暴露出去。
#   qmllint 无法把「以单例类型声明的属性」当对象类型来解析——它会把这个属性退化成
#   QObject，于是所有 `AppTheme.colors.pageBg` 都被报成 missing-property（当前 123 条，
#   全部属于这一类）。
#
#   对照实验（同一份代码、同一套 -I）：
#     property color a: Colors.pageBg            -> 无告警（直接引用单例成员，能解析）
#     property color b: AppTheme.colors.pageBg   -> missing-property（经单例类型属性退化）
#   也就是「单例本身可解析，单例做属性类型不可解析」。
#
#   想彻底消除就得把主题改成 C++ 注册的 QObject 单例（属性带 Q_PROPERTY，qmltypes 里有
#   完整类型信息）。那是 M2 的架构选择，不该为了 lint 静默改；在此之前宁可明确关掉这一项，
#   也不要在 123 行里散布 `// qmllint disable`。
#
# 其余检查（unqualified、import 错误、类型未知、绑定错误等）全部保持开启；
# 委托里的 unqualified 已通过 `pragma ComponentBehavior: Bound` 真正修掉，不是关掉的。
#
# 用法：scripts/lint.ps1（会带上 -I build/<preset>/qml）
#
# 注意键名是 **PascalCase**（MissingProperty），不是告警标签里的连字符形式
# （missing-property）。写成连字符不会报错、只会被静默忽略——所以改这个文件后
# 一定要跑一遍 scripts/lint.ps1 看告警数是否真的变了。
[Warnings]
MissingProperty=disable
