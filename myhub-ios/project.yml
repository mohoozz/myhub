# MyHub iOS — XcodeGen 工程定义
# 用法：brew install xcodegen && xcodegen generate（详见 README.md）
name: MyHub
options:
  bundleIdPrefix: com.mohoo
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"

# SPM 三方依赖（《需求分析文档》§8.3）
packages:
  AMSMB2:                              # SMB2/3 直连（基于 libsmb2）
    url: https://github.com/amosavian/AMSMB2
    from: 3.0.0
  VLCKit:                              # 全格式软解兜底（MobileVLCKit 3.x）
    url: https://github.com/tylerjonesio/vlckit-spm.git
    from: 3.6.0                         # 官方 3.x 无 SPM，用社区 3.6.0 包装器（模块名仍为 MobileVLCKit）
  ZIPFoundation:                       # zip / cbz / epub
    url: https://github.com/weichsel/ZIPFoundation.git
    from: 0.9.19
  UnrarKit:                            # rar / cbr（本地 vendor：官方仓库不支持 SPM）
    path: ThirdParty/UnrarKit
  GRDB:                                # SQLite 结构化存储
    url: https://github.com/groue/GRDB.swift.git
    from: 6.29.0
  Nuke:                                # 图片加载与缓存（封面/缩略图）
    url: https://github.com/kean/Nuke.git
    from: 12.8.0

targets:
  MyHub:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: MyHub
        excludes:
          - "Info.plist"
          - "MyHub.entitlements"
    info:
      path: MyHub/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # App 平时锁竖屏，播放页横竖屏切换经 AppDelegate 动态方向掩码放开横屏（需声明支持项）
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: MyHub/MyHub.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mohoo.myhubios
        TARGETED_DEVICE_FAMILY: "1,2"          # iPhone + iPad
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        # DEVELOPMENT_TEAM: ""                 # 在 Xcode Signing 中配置你的 Team
    dependencies:
      - package: AMSMB2
        product: AMSMB2
        embed: true
      - package: VLCKit
        product: VLCKitSPM
      - package: ZIPFoundation
        product: ZIPFoundation
      - package: UnrarKit
        product: UnrarKit
      - package: GRDB
        product: GRDB
      - package: Nuke
        product: Nuke

schemes:
  MyHub:
    build:
      targets:
        MyHub: all
    run:
      config: Debug
    archive:
      config: Release
