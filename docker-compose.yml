services:
  # Go 后端服务
  myhub-server:
    build:
      context: ./myhub-server
    container_name: myhub-server
    restart: unless-stopped
    environment:
      - MYHUB_SERVER_PORT=8080
      - MYHUB_SERVER_MODE=release
      - MYHUB_DATABASE_PATH=/data/myhub.db
      # 生产环境务必修改 JWT 密钥
      - MYHUB_JWT_SECRET=${JWT_SECRET:-please-change-me-in-production}
    volumes:
      - myhub-data:/data
      # 本地路径源挂载示例（按需修改并加入 config.yaml 白名单）
      # - /path/to/media:/mnt/media:ro
    networks:
      - myhub
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Caddy 反向代理（自动 HTTPS）
  caddy:
    image: caddy:2-alpine
    container_name: myhub-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - myhub
    depends_on:
      myhub-server:
        condition: service_healthy

  # 可选：OpenClaw AI 抓取网关（动态模块 M5 启用）
  # openclaw:
  #   image: openclaw/openclaw:latest
  #   container_name: myhub-openclaw
  #   restart: unless-stopped
  #   volumes:
  #     - openclaw-data:/data
  #   networks:
  #     - myhub

  # 可选：OpenList 存储网关（接入几十种网盘）
  # openlist:
  #   image: openlistteam/openlist:latest
  #   container_name: myhub-openlist
  #   restart: unless-stopped
  #   volumes:
  #     - openlist-data:/opt/openlist/data
  #   networks:
  #     - myhub

volumes:
  myhub-data:
  caddy-data:
  caddy-config:
  # openclaw-data:
  # openlist-data:

networks:
  myhub:
    driver: bridge
